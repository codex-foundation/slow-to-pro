<svg width="1284" height="2778" viewBox="0 0 1284 2778" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <!-- Subtle radial glow behind the icon -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1284" height="2778" fill="url(#bg)"/>

  <!-- Decorative circles (very subtle) -->
  <circle cx="642" cy="1389" r="520" fill="url(#glow)"/>
  <circle cx="642" cy="1389" r="720" fill="none" stroke="white" stroke-width="1" opacity="0.06"/>
  <circle cx="642" cy="1389" r="600" fill="none" stroke="white" stroke-width="1" opacity="0.06"/>

  <!-- App icon centered (scaled 2.2× from 1024 px original, centered at 642,1310) -->
  <!-- Icon group: center = 512,530 in SVG space → map to 642,1310 in splash, scale=0.52 -->
  <g transform="translate(642,1310) scale(0.52) translate(-512,-530)">
    <!-- Icon background rounded rect — omitted on splash (bg is already blue) -->
    <circle cx="512" cy="530" r="274" fill="none" stroke="white" stroke-width="42"/>
    <line x1="438" y1="228" x2="586" y2="228" stroke="white" stroke-width="38" stroke-linecap="round"/>
    <line x1="512" y1="180" x2="512" y2="256" stroke="white" stroke-width="38" stroke-linecap="round"/>
    <line x1="786" y1="530" x2="742" y2="530" stroke="white" stroke-width="30" stroke-linecap="round" opacity="0.45"/>
    <line x1="238" y1="530" x2="282" y2="530" stroke="white" stroke-width="30" stroke-linecap="round" opacity="0.45"/>
    <line x1="386" y1="660" x2="638" y2="380" stroke="white" stroke-width="46" stroke-linecap="round"/>
    <polyline points="602,420 638,380 596,368" fill="none" stroke="white" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="386" cy="660" r="26" fill="white"/>
  </g>

  <!-- App name -->
  <text
    x="642"
    y="1570"
    text-anchor="middle"
    font-family="'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="84"
    font-weight="700"
    letter-spacing="-1"
    fill="white">Slow to Pro</text>

  <!-- Tagline -->
  <text
    x="642"
    y="1648"
    text-anchor="middle"
    font-family="'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="38"
    font-weight="400"
    letter-spacing="1"
    fill="white"
    opacity="0.65">Master your time. Every day.</text>
</svg>
